<div class="login-page">
  <section class="login-visual"><div class="login-brand"><span>📚</span><div><b>BIBLIO</b><small>3D</small></div></div><div class="login-visual__copy"><p>Votre bibliothèque, simplement.</p><h1>Lire, emprunter<br>et réserver.</h1></div><img src="assets/ui/librarian.png" alt="Jeune lecteur tenant un livre"></section>
  <main class="login-panel"><div class="login-card"><span class="login-card__eyebrow">Bienvenue</span><h1>Connexion</h1><p class="login-intro">Accédez à votre espace bibliothèque avec les identifiants fournis par l’administrateur.</p><p *ngIf="errorMessage" class="alert-message alert-message--error" role="alert">{{ errorMessage }}</p><form class="app-form" autocomplete="off" #loginForm="ngForm" (ngSubmit)="login(loginForm)"><div class="form-field"><label for="loginUsername">Identifiant</label><input class="form-control-dark" type="text" name="username" ngModel id="loginUsername" placeholder="Votre identifiant" autocomplete="username" required></div><div class="form-field"><label for="loginPassword">Mot de passe</label><input class="form-control-dark" type="password" name="password" ngModel id="loginPassword" placeholder="Votre mot de passe" autocomplete="current-password" required></div><button class="primary-button login-submit" type="submit" [disabled]="loginForm.invalid || loading">{{ loading ? 'Connexion en cours...' : 'Se connecter' }}</button></form><p class="login-help">Un problème de connexion ? Contactez le bibliothécaire.</p></div></main>
</div>
