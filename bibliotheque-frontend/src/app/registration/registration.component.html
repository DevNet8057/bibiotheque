<div class="app-page form-page"><header class="page-hero"><div class="page-hero__copy"><h1>Nouvel adhérent</h1><p>Créez un accès à la bibliothèque</p></div><span class="user-hero-icon">🧑</span></header>
  <p *ngIf="successMessage" class="alert-message" role="status">✓ {{ successMessage }}</p><p *ngIf="errorMessage" class="alert-message alert-message--error" role="alert">{{ errorMessage }}</p>
  <section class="form-card"><div class="section-heading"><div><h2>Informations du compte</h2><p>Communiquez ensuite l’identifiant à l’adhérent.</p></div></div><form class="app-form" #userForm="ngForm" (ngSubmit)="onSubmit()" autocomplete="off"><div class="form-grid"><div class="form-field"><label for="name">Nom complet</label><input class="form-control-dark" type="text" id="name" [(ngModel)]="user.name" name="name" placeholder="Prénom et nom" required></div><div class="form-field"><label for="username">Identifiant</label><input class="form-control-dark" type="text" id="username" [(ngModel)]="user.username" name="username" placeholder="Identifiant de connexion" required></div><div class="form-field"><label for="password">Mot de passe temporaire</label><input class="form-control-dark" type="password" id="password" [(ngModel)]="user.password" name="password" minlength="6" required><small>Utilisez au moins 6 caractères.</small></div><div class="form-field"><label for="role">Rôle</label><select class="form-control-dark" id="role" [(ngModel)]="user.role[0].roleName" name="role" required><option value="User">Adhérent</option><option value="Admin">Bibliothécaire</option></select></div></div><div class="form-actions"><a class="secondary-button" routerLink="/users">Annuler</a><button class="primary-button" type="submit" [disabled]="userForm.invalid || saving">{{ saving ? 'Création...' : 'Créer le compte' }}</button></div></form></section>
</div>
