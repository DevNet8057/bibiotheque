<div class="app-page form-page"><header class="page-hero"><div class="page-hero__copy"><h1>Modifier l’adhérent</h1><p>Mettez à jour son identité et ses permissions</p></div><span class="user-hero-icon">✏️</span></header>
  <section *ngIf="loading" class="state-card"><span class="loading-orbit"></span><h2>Chargement du compte</h2></section><p *ngIf="successMessage" class="alert-message" role="status">✓ {{ successMessage }}</p><p *ngIf="!loading && errorMessage" class="alert-message alert-message--error" role="alert">{{ errorMessage }}</p>
  <section *ngIf="!loading" class="form-card"><div class="section-heading"><div><h2>Informations du compte</h2><p>Le mot de passe actuel n’est pas modifié ici.</p></div></div><form class="app-form" #userForm="ngForm" (ngSubmit)="onSubmit()"><div class="form-grid"><div class="form-field"><label for="name">Nom complet</label><input class="form-control-dark" type="text" id="name" [(ngModel)]="user.name" name="name" required></div><div class="form-field"><label for="username">Identifiant</label><input class="form-control-dark" type="text" id="username" [(ngModel)]="user.username" name="username" required></div><div class="form-field form-field--full"><label for="role">Rôle</label><select class="form-control-dark" id="role" [(ngModel)]="user.role[0].roleName" name="role" required><option value="ADMINISTRATEUR">Administrateur</option><option value="BIBLIOTHECAIRE">Bibliothécaire</option><option value="ADHERENT">Adhérent</option></select></div></div><div class="form-actions"><a class="secondary-button" routerLink="/users">Retour</a><button class="primary-button" type="submit" [disabled]="userForm.invalid || saving">{{ saving ? 'Enregistrement...' : 'Enregistrer' }}</button></div></form></section>
</div>
