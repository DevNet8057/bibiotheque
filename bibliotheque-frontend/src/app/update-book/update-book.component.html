<div class="app-page form-page"><header class="page-hero"><div class="page-hero__copy"><h1>Modifier le livre</h1><p>Mettez à jour les informations du catalogue</p></div><span class="book-hero-icon">✏️</span></header>
  <section *ngIf="loading" class="state-card"><span class="loading-orbit"></span><h2>Chargement du livre</h2></section>
  <p *ngIf="successMessage" class="alert-message" role="status">✓ {{ successMessage }}</p><p *ngIf="!loading && errorMessage" class="alert-message alert-message--error" role="alert">{{ errorMessage }}</p>
  <section *ngIf="!loading" class="form-card"><div class="section-heading"><div><h2>Informations du livre</h2><p>Modifiez uniquement les champs nécessaires.</p></div></div><form class="app-form" #bookForm="ngForm" (ngSubmit)="onSubmit()"><div class="form-grid"><div class="form-field form-field--full"><label for="bookName">Titre</label><input class="form-control-dark" type="text" id="bookName" [(ngModel)]="book.bookName" name="bookName" required></div><div class="form-field"><label for="bookAuthor">Auteur</label><input class="form-control-dark" type="text" id="bookAuthor" [(ngModel)]="book.bookAuthor" name="bookAuthor" required></div><div class="form-field"><label for="bookGenre">Genre</label><input class="form-control-dark" type="text" id="bookGenre" [(ngModel)]="book.bookGenre" name="bookGenre" required></div><div class="form-field form-field--full"><label for="noOfCopies">Nombre d’exemplaires</label><input class="form-control-dark" type="number" min="0" id="noOfCopies" [(ngModel)]="book.noOfCopies" name="noOfCopies" required></div></div><div class="form-actions"><a class="secondary-button" routerLink="/books">Retour au catalogue</a><button class="primary-button" type="submit" [disabled]="bookForm.invalid || saving">{{ saving ? 'Enregistrement...' : 'Enregistrer' }}</button></div></form></section>
</div>
