<section class="form-card reservation-form" aria-labelledby="create-reservation-title">
  <div class="form-title"><div><h2 id="create-reservation-title">Créer une réservation</h2><p>Sélectionnez un ouvrage et son adhérent.</p></div><span>⭐</span></div>
  <form (ngSubmit)="submit()" #reservationForm="ngForm" novalidate>
    <div class="form-field"><label for="reservation-book">Livre</label><select class="form-control-dark" id="reservation-book" name="livreId" [(ngModel)]="livreId" required><option [ngValue]="null">Sélectionner un livre</option><option *ngFor="let book of books" [ngValue]="book.bookId">{{ book.bookName }} — {{ bookStatus(book) }} ({{ book.noOfCopies }} exemplaire{{ book.noOfCopies > 1 ? 's' : '' }})</option></select><small class="status-help">Le statut est calculé d’après le nombre d’exemplaires disponible.</small><div class="availability-legend" aria-label="Statuts de disponibilité"><span><i class="availability-dot availability-dot--available"></i>Disponible</span><span><i class="availability-dot availability-dot--unavailable"></i>Indisponible</span></div></div>
    <div class="form-field"><label for="reservation-member">Adhérent</label><select class="form-control-dark" id="reservation-member" name="adherentId" [(ngModel)]="adherentId" required><option [ngValue]="null">Sélectionner un adhérent</option><option *ngFor="let user of users" [ngValue]="user.userId">{{ user.name }} ({{ user.username }})</option></select></div>
    <p class="form-error" *ngIf="errorMessage" role="alert">{{ errorMessage }}</p>
    <button class="primary-button submit-button" type="submit" [disabled]="reservationForm.invalid || saving">{{ saving ? 'Création en cours...' : '✦ Créer la réservation' }}</button>
    <p class="form-hint" *ngIf="!errorMessage">Les deux champs sont obligatoires pour créer la réservation.</p>
  </form>
</section>
